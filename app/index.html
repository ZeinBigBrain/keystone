<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Keystone</title>
<link rel="stylesheet" href="/style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M10 4h12l4 24H6z' fill='%23e0a54a'/%3E%3C/svg%3E">
</head>
<body>
<header class="topbar">
  <button class="icon-btn" id="menuBtn" title="Show or hide the course menu" aria-label="Toggle menu">
    <svg viewBox="0 0 24 24" width="20" height="20"><path d="M4 6h16M4 12h16M4 18h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
  </button>
  <a class="brand" href="#/" title="Home">
    <svg viewBox="0 0 32 32" width="22" height="22" aria-hidden="true"><path d="M10 4h12l4 24H6z" fill="var(--accent)"/><path d="M6 28h20" stroke="var(--accent-ink)" stroke-width="2"/></svg>
    <span>Keystone</span>
  </a>
  <div class="stats">
    <div class="stat streak" id="streakStat" title="Daily streak">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 2c1 4 5 6 5 11a5 5 0 0 1-10 0c0-2 1-3.5 2-4.5 0 2 1 3 2 3 0-3-1-6 1-9.5z" fill="currentColor"/></svg>
      <span id="streakNum">0</span>
    </div>
    <div class="stat level" title="Level and XP">
      <span class="lvl" id="levelNum">Lv 1</span>
      <div class="xpbar"><div class="xpfill" id="xpFill"></div></div>
      <span class="xptext" id="xpText">0 XP</span>
    </div>
    <button class="icon-btn" id="trophyBtn" title="Achievements" aria-label="Achievements">
      <svg viewBox="0 0 24 24" width="20" height="20"><path d="M7 4h10v4a5 5 0 0 1-10 0zM7 6H4a3 3 0 0 0 3 4M17 6h3a3 3 0 0 1-3 4M12 13v4M8 20h8" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </div>
</header>

<div class="layout">
  <nav class="sidebar" id="sidebar" aria-label="Courses"></nav>
  <main class="main" id="main"></main>
</div>

<div class="toasts" id="toasts" aria-live="polite"></div>

<dialog id="dialog">
  <div class="dialog-body" id="dialogBody"></div>
  <form method="dialog" class="dialog-actions"><button class="btn">Close</button></form>
</dialog>

<script src="/app.js"></script>
</body>
</html>
